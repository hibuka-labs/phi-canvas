[package]
name = "phi-canvas"
version = "0.1.1"
edition = "2024"
description = "Design canvas server for the phi family — local visual companion: screens, options, selection events"
license = "MIT"
repository = "https://github.com/hibuka-labs/phi-canvas"
keywords = ["agent", "ai", "llm", "design", "canvas"]
categories = ["development-tools", "web-programming::http-server"]

[dependencies]
axum = "0.8"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
